<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f0fdfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .title{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:30px;font-weight:700;fill:#0f172a}
      .sub{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:15px;fill:#64748b}
      .h{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:19px;font-weight:700;fill:#0f172a}
      .t{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:14px;fill:#334155}
      .small{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:13px;fill:#475569}
      .line{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#94a3b8;stroke-width:3;stroke-dasharray:8 8;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1180" height="660" rx="28" fill="url(#bg)"/>
  <text x="70" y="70" class="title">风险事件闭环流程</text>
  <text x="70" y="100" class="sub">从风险发现到护理处置，再到归档复盘，形成可追溯的机构安全管理链路</text>

  <g filter="url(#shadow)">
    <rect x="80" y="190" width="190" height="120" rx="18" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="115" y="232" class="h">1. 风险发现</text>
    <text x="115" y="264" class="t">画面/传感器异常</text>
    <text x="115" y="290" class="t">触发AI识别</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="365" y="120" width="205" height="125" rx="18" fill="#dcfce7" stroke="#86efac"/>
    <text x="400" y="162" class="h">2. AI研判</text>
    <text x="400" y="194" class="t">检测框、姿态骨架</text>
    <text x="400" y="220" class="t">生成风险信号</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="665" y="120" width="205" height="125" rx="18" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="700" y="162" class="h">3. 事件入队</text>
    <text x="700" y="194" class="t">生成事件等级</text>
    <text x="700" y="220" class="t">进入调度队列</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="910" y="270" width="205" height="125" rx="18" fill="#ffe4e6" stroke="#fda4af"/>
    <text x="945" y="312" class="h">4. 护理派单</text>
    <text x="945" y="344" class="t">推荐护理员</text>
    <text x="945" y="370" class="t">附带处置建议</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="665" y="455" width="205" height="125" rx="18" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="700" y="497" class="h">5. 到场处置</text>
    <text x="700" y="529" class="t">执行应急SOP</text>
    <text x="700" y="555" class="t">反馈处理结果</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="365" y="455" width="205" height="125" rx="18" fill="#ccfbf1" stroke="#5eead4"/>
    <text x="400" y="497" class="h">6. 归档复盘</text>
    <text x="400" y="529" class="t">形成时间线</text>
    <text x="400" y="555" class="t">进入数据看板</text>
  </g>

  <path class="line" d="M270 230 C310 190 325 180 365 180"/>
  <path class="line" d="M570 183 L665 183"/>
  <path class="line" d="M870 218 C925 235 945 250 970 270"/>
  <path class="line" d="M975 395 C940 445 910 475 870 502"/>
  <path class="line" d="M665 518 L570 518"/>
  <path class="dash" d="M365 518 C215 485 140 410 158 310"/>

  <g filter="url(#shadow)">
    <rect x="95" y="410" width="210" height="110" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="125" y="450" class="h">复盘反哺</text>
    <text x="125" y="482" class="small">更新老人画像、风险阈值</text>
    <text x="125" y="506" class="small">优化巡查重点和护理计划</text>
  </g>
</svg>
