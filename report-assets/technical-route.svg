<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:30px;font-weight:700;fill:#0f172a}
      .sub{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:15px;fill:#64748b}
      .step{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:22px;font-weight:700;fill:#0f172a}
      .body{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:14px;fill:#334155}
      .num{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:white}
      .line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1180" height="620" rx="28" fill="url(#bg)"/>
  <text x="70" y="70" class="title">技术路线</text>
  <text x="70" y="100" class="sub">以“采集-识别-研判-执行-复盘”为主线，将AI能力转化为护理业务动作</text>

  <g filter="url(#shadow)">
    <rect x="70" y="185" width="175" height="245" rx="18" fill="#dbeafe" stroke="#93c5fd"/>
    <circle cx="105" cy="220" r="20" fill="#2563eb"/>
    <text x="99" y="227" class="num">1</text>
    <text x="95" y="265" class="step">采集层</text>
    <text x="95" y="310" class="body">摄像头画面</text>
    <text x="95" y="338" class="body">床垫压力</text>
    <text x="95" y="366" class="body">门磁/雷达</text>
    <text x="95" y="394" class="body">可穿戴数据</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="285" y="145" width="175" height="325" rx="18" fill="#dcfce7" stroke="#86efac"/>
    <circle cx="320" cy="180" r="20" fill="#16a34a"/>
    <text x="314" y="187" class="num">2</text>
    <text x="310" y="225" class="step">识别层</text>
    <text x="310" y="270" class="body">YOLO目标检测</text>
    <text x="310" y="298" class="body">人体姿态估计</text>
    <text x="310" y="326" class="body">目标框与关键点</text>
    <text x="310" y="354" class="body">结构化输出</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="500" y="110" width="180" height="395" rx="18" fill="#fef3c7" stroke="#fbbf24"/>
    <circle cx="535" cy="145" r="20" fill="#d97706"/>
    <text x="529" y="152" class="num">3</text>
    <text x="525" y="190" class="step">研判层</text>
    <text x="525" y="235" class="body">规则后处理</text>
    <text x="525" y="263" class="body">老人行为画像</text>
    <text x="525" y="291" class="body">健康风险标签</text>
    <text x="525" y="319" class="body">护理知识库</text>
    <text x="525" y="347" class="body">智能助手建议</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="720" y="145" width="175" height="325" rx="18" fill="#ffe4e6" stroke="#fda4af"/>
    <circle cx="755" cy="180" r="20" fill="#e11d48"/>
    <text x="749" y="187" class="num">4</text>
    <text x="745" y="225" class="step">执行层</text>
    <text x="745" y="270" class="body">风险调度</text>
    <text x="745" y="298" class="body">护理派单</text>
    <text x="745" y="326" class="body">应急SOP</text>
    <text x="745" y="354" class="body">处理反馈</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="935" y="185" width="175" height="245" rx="18" fill="#ede9fe" stroke="#c4b5fd"/>
    <circle cx="970" cy="220" r="20" fill="#7c3aed"/>
    <text x="964" y="227" class="num">5</text>
    <text x="960" y="265" class="step">复盘层</text>
    <text x="960" y="310" class="body">事件归档</text>
    <text x="960" y="338" class="body">响应时间统计</text>
    <text x="960" y="366" class="body">数据看板</text>
    <text x="960" y="394" class="body">模型持续优化</text>
  </g>

  <path class="line" d="M245 307 L285 307"/>
  <path class="line" d="M460 307 L500 307"/>
  <path class="line" d="M680 307 L720 307"/>
  <path class="line" d="M895 307 L935 307"/>
  <path d="M1024 430 C990 565 185 565 156 430" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 8" fill="none" marker-end="url(#arrow)"/>
  <text x="445" y="560" class="body">处置结果反哺事件库、老人画像和规则阈值，形成持续优化闭环</text>
</svg>
