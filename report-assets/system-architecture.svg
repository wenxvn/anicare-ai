<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6f3"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe4e6"/>
      <stop offset="1" stop-color="#fecdd3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .title{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:30px;font-weight:700;fill:#0f172a}
      .sub{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:15px;fill:#64748b}
      .h{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:20px;font-weight:700;fill:#0f172a}
      .t{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:15px;fill:#334155}
      .small{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:13px;fill:#64748b}
      .line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1180" height="680" rx="28" fill="url(#bg)"/>
  <text x="70" y="70" class="title">安养智巡系统总体架构</text>
  <text x="70" y="100" class="sub">从多源感知、AI识别、业务接口到护理闭环的前后端一体化架构</text>

  <g filter="url(#shadow)">
    <rect x="70" y="150" width="240" height="165" rx="18" fill="url(#blue)" stroke="#93c5fd"/>
    <text x="100" y="190" class="h">多源感知层</text>
    <text x="100" y="225" class="t">摄像头画面</text>
    <text x="100" y="252" class="t">床垫、门磁、雷达</text>
    <text x="100" y="279" class="t">可穿戴与护理记录</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="380" y="150" width="260" height="165" rx="18" fill="url(#green)" stroke="#86efac"/>
    <text x="410" y="190" class="h">本地AI服务</text>
    <text x="410" y="225" class="t">YOLO目标检测</text>
    <text x="410" y="252" class="t">YOLO姿态估计</text>
    <text x="410" y="279" class="t">风险信号后处理</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="710" y="150" width="260" height="165" rx="18" fill="url(#amber)" stroke="#fbbf24"/>
    <text x="740" y="190" class="h">后端API层</text>
    <text x="740" y="225" class="t">视觉、事件、调度</text>
    <text x="740" y="252" class="t">档案、应急、助手</text>
    <text x="740" y="279" class="t">统一业务数据结构</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="225" y="405" width="300" height="170" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="255" y="445" class="h">前端业务后台</text>
    <text x="255" y="480" class="t">总览、监测、健康、调度</text>
    <text x="255" y="507" class="t">画像、应急、事件、看板</text>
    <text x="255" y="534" class="t">智能助手与护理建议</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="655" y="405" width="300" height="170" rx="18" fill="url(#rose)" stroke="#fda4af"/>
    <text x="685" y="445" class="h">机构使用者</text>
    <text x="685" y="480" class="t">值班主管：研判与派单</text>
    <text x="685" y="507" class="t">护理员：到场与处置</text>
    <text x="685" y="534" class="t">管理者：看板与复盘</text>
  </g>

  <path class="line" d="M310 232 C335 232 350 232 380 232"/>
  <path class="line" d="M640 232 C670 232 685 232 710 232"/>
  <path class="line" d="M840 315 C840 360 760 385 560 450"/>
  <path class="line" d="M525 490 C570 490 610 490 655 490"/>
  <path class="line" d="M710 575 C570 640 330 625 295 575"/>

  <rect x="72" y="605" width="1036" height="42" rx="21" fill="#e2e8f0"/>
  <text x="100" y="631" class="small">运行闭环：感知数据进入AI服务，后端生成业务对象，前端完成监测、派单、处置与复盘，反馈数据继续沉淀到系统中。</text>
</svg>
